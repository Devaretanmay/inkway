name: Release

on:
  push:
    tags:
      # GitHub Actions uses glob patterns here, not regex. Match versioned
      # tags broadly at the trigger layer, then enforce strict semver below.
      - "v*.*.*"
      - "!v*-dirty*"

permissions:
  contents: write
  packages: write

# Deleting and recreating a tag can enqueue multiple runs for the same ref.
# Serialize them so publishers never race while replacing same-name assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
      is_stable: ${{ steps.release_meta.outputs.is_stable }}
    # The Go suite includes DB-backed packages (notably internal/handler,
    # which fails closed without a database). Mirror ci.yml: provide the
    # service and migrate the schema before running tests, or no tag build
    # could ever pass verification.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: inkway
          POSTGRES_USER: inkway
          POSTGRES_PASSWORD: inkway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inkway -d inkway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://inkway:inkway@localhost:5432/inkway?sslmode=disable
      REDIS_TEST_URL: redis://localhost:6379/1
      GOFLAGS: -count=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag name
        id: release_meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "Triggered by tag: $tag"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like vX.Y.Z or vX.Y.Z-suffix; got '$tag'."
            exit 1
          fi
          if [[ "$tag" == *-dirty* ]]; then
            echo "::error::Refusing to release from dirty tag '$tag'."
            exit 1
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Deliberately independent from the minimum patch in server/go.mod:
          # releases follow the newest 1.26 patch available to setup-go.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Record Go toolchain
        run: go version

      - name: Run migrations for DB-backed tests
        working-directory: server
        run: go run ./cmd/migrate up

      - name: Verify Go test wrapper
        run: bash scripts/test-go.test.sh

      - name: Run tests
        run: bash scripts/test-go.sh --race

      - name: Scan Go vulnerabilities
        # Fail closed unless an administrator scopes the documented emergency
        # override to this exact tag. See .github/RELEASING.md.
        if: ${{ vars.ALLOW_VULN_BYPASS_FOR_TAG != github.ref_name }}
        working-directory: server
        run: go tool govulncheck ./...

      - name: Record emergency vulnerability-scan bypass
        if: ${{ vars.ALLOW_VULN_BYPASS_FOR_TAG == github.ref_name }}
        run: echo "::warning::govulncheck was explicitly skipped for ${GITHUB_REF_NAME}; see .github/RELEASING.md"

  release:
    needs: verify
    # Only run on the canonical upstream repo. Forks don't have the
    # HOMEBREW_TAP_GITHUB_TOKEN secret and should not be publishing to
    # `inkway-ai/homebrew-tap` anyway. Without this guard, every fork's
    # tag push fails this job (401 against the upstream tap), which makes
    # downstream CI go red without affecting the actual artifact pipeline.
    if: github.repository_owner == 'inkway-ai'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Deliberately independent from the minimum patch in server/go.mod:
          # releases follow the newest 1.26 patch available to setup-go.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Record Go toolchain
        run: go version

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Multi-arch images are built natively per platform on dedicated runners
  # (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm) and merged into a
  # manifest list. This avoids QEMU emulation, which was making the Next.js
  # arm64 build run for 30+ minutes per release.
  docker-backend-build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute backend image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/inkway-backend
          labels: |
            org.opencontainers.image.title=Inkway Backend
            org.opencontainers.image.description=Inkway self-hosted backend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-backend-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-backend-${{ env.PLATFORM_PAIR }}
          build-args: |
            VERSION=${{ needs.verify.outputs.tag_name }}
            COMMIT=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/inkway-backend,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-backend-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-backend-merge:
    needs: [verify, docker-backend-build]
    runs-on: ubuntu-latest
    concurrency:
      group: release-docker-backend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-backend-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute backend image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/inkway-backend
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.verify.outputs.tag_name }}
            type=sha,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/inkway-backend@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/inkway-backend:${{ steps.meta.outputs.version }}

  docker-web-build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute web image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/inkway-web
          labels: |
            org.opencontainers.image.title=Inkway Web
            org.opencontainers.image.description=Inkway self-hosted web frontend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-web-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-web-${{ env.PLATFORM_PAIR }}
          build-args: |
            REMOTE_API_URL=http://backend:8080
            NEXT_PUBLIC_APP_VERSION=${{ needs.verify.outputs.tag_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/inkway-web,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-web-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-web-merge:
    needs: [verify, docker-web-build]
    runs-on: ubuntu-latest
    concurrency:
      group: release-docker-web-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-web-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute web image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/inkway-web
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.verify.outputs.tag_name }}
            type=sha,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/inkway-web@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/inkway-web:${{ steps.meta.outputs.version }}

  helm-chart:
    needs: [verify, docker-backend-merge, docker-web-merge]
    if: github.repository_owner == 'inkway-ai'
    runs-on: ubuntu-latest
    concurrency:
      group: release-helm-chart-${{ github.ref }}
      cancel-in-progress: true
    env:
      CHART_DIR: deploy/helm/inkway
      OCI_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Sync chart metadata with release tag
        env:
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
        run: |
          chart_version="${TAG_NAME#v}"
          sed -i -E "s/^version:.*/version: ${chart_version}/" "$CHART_DIR/Chart.yaml"
          sed -i -E "s/^appVersion:.*/appVersion: \"${TAG_NAME}\"/" "$CHART_DIR/Chart.yaml"
          echo "CHART_VERSION=${chart_version}" >> "$GITHUB_ENV"

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Package chart
        run: helm package "$CHART_DIR" --destination .chart-packages

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR
        run: helm push ".chart-packages/inkway-${CHART_VERSION}.tgz" "$OCI_REGISTRY"

      - name: Verify published chart
        run: helm show chart "$OCI_REGISTRY/inkway" --version "$CHART_VERSION"

  # Build the Desktop installers for Linux and Windows and upload them to
  # the GitHub Release that the `release` job above just published. macOS
  # Desktop continues to ship via the manual `release-desktop` skill so it
  # can be signed + notarized with Apple Developer credentials that are
  # not (yet) wired into CI.
  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rpmbuild (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Deliberately independent from the minimum patch in server/go.mod:
          # releases follow the newest 1.26 patch available to setup-go.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Record Go toolchain
        run: go version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Desktop installers (${{ matrix.target }})
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder's GitHub publisher reads this:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same-tag reruns must also replace Desktop assets after the
          # publisher's default two-hour safety window has elapsed.
          EP_GH_IGNORE_TIME: "true"
          # Disable code signing on Linux/Windows for now — the public
          # release is unsigned for these platforms, the CLI carries the
          # trust boundary. Set CSC_LINK in repo secrets to enable
          # Windows signing later.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package.mjs --${{ matrix.target }} --x64 --arm64 --publish always

  # Zero-cost macOS alpha: ad-hoc signed Inkway.app + DMG + ZIP + SHA256SUMS +
  # release-manifest.json, published to the GitHub Release. No Apple Developer
  # Program membership, no Developer ID signing, no notarization, no paid CI.
  # Runs on a self-hosted macOS arm64 runner because the real packaged build
  # (pinned Ink runtime download + checksum verification, Go backend, bundled
  # PostgreSQL, electron-builder DMG) is only proven on that host class.
  # Every gate below fails the job before anything is uploaded: a partially
  # validated alpha is never published.
  desktop-mac-alpha:
    needs: verify
    runs-on: [self-hosted, macOS, ARM64]
    concurrency:
      group: release-mac-alpha-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      # No Developer ID identity on the runner: electron-builder falls back
      # to ad-hoc signing. APPLE_TEAM_ID must stay unset so notarization is
      # skipped (package.mjs passes -c.mac.notarize=false in that case).
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag name
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like vX.Y.Z or vX.Y.Z-suffix; got '$tag'."
            exit 1
          fi
          if [[ "$tag" == *-dirty* ]]; then
            echo "::error::Refusing to release from dirty tag '$tag'."
            exit 1
          fi
          echo "TAG_NAME=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Verify clean source tree
        run: |
          git diff --quiet && git diff --cached --quiet
          git diff --check
          node scripts/check-brand-hygiene.mjs

      - name: Reject developer-local paths in production packaging files
        run: |
          if rg -n '../ink/.ink/models|/Users/[^/]+/' apps/desktop/scripts/fetch-ink-runtime.mjs apps/desktop/scripts/package-ink-runtime.mjs apps/desktop/scripts/ink-runtime.json apps/desktop/scripts/make-alpha-release.mjs; then
            echo 'developer-local Ink paths found in production packaging files' >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces except mobile)
        run: pnpm typecheck

      - name: Lint (all workspaces except mobile)
        run: pnpm lint

      - name: Desktop tests
        run: pnpm --filter @inkway/desktop test

      - name: Fetch and verify pinned Ink runtime
        run: make ink-runtime

      - name: Real Ink engine/model/lifecycle proof from staged runtime
        working-directory: server
        env:
          INKWAY_INK_BUNDLE: ${{ github.workspace }}/apps/desktop/resources/ink
        run: go test ./internal/ink -run '^TestBundledInk' -count=1 -v

      # The bundled app is ~3.6 GB; the DMG stage needs room beyond it.
      # make-alpha-release.mjs re-verifies everything below, but a full
      # volume fails late, so assert headroom up front instead.
      - name: Require staging headroom for the DMG volume
        run: |
          free_gb=$(df -g / | awk 'NR==2 {print $4}')
          echo "free disk: ${free_gb} GiB"
          if [ "$free_gb" -lt 15 ]; then
            echo "::error::macOS alpha packaging needs >= 15 GiB free (app + DMG staging + output); have ${free_gb} GiB."
            exit 1
          fi

      - name: Build Inkway.app + DMG + ZIP (macOS arm64, ad-hoc signed)
        working-directory: apps/desktop
        run: node scripts/package.mjs --mac --arm64 --publish never

      - name: Verify artifacts, generate SHA256SUMS + release-manifest.json
        working-directory: apps/desktop
        run: node scripts/make-alpha-release.mjs --version "${{ env.VERSION }}"

      - name: Publish DMG/ZIP/SHA256SUMS/manifest to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --title "Inkway $VERSION" \
              --notes-file "$GITHUB_WORKSPACE/.github/release-template.md" \
              --prerelease
          fi
          # make-alpha-release.mjs splits artifacts >= 1500 MB into
          # <name>.part-NN (GitHub caps release files below 2 GiB) and
          # records everything in SHA256SUMS + release-manifest.json, so
          # upload the whole dist set except the oversized originals: when
          # parts exist the reassembly check in that script already proved
          # they reconstruct the verified bytes.
          upload=(
            apps/desktop/dist/SHA256SUMS
            apps/desktop/dist/release-manifest.json
          )
          if compgen -G "apps/desktop/dist/Inkway-$VERSION-mac-arm64.dmg.part-*" > /dev/null; then
            upload+=(apps/desktop/dist/Inkway-"$VERSION"-mac-arm64.dmg.part-*)
          else
            upload+=(apps/desktop/dist/Inkway-"$VERSION"-mac-arm64.dmg)
          fi
          if compgen -G "apps/desktop/dist/Inkway-$VERSION-mac-arm64.zip.part-*" > /dev/null; then
            upload+=(apps/desktop/dist/Inkway-"$VERSION"-mac-arm64.zip.part-*)
          else
            upload+=(apps/desktop/dist/Inkway-"$VERSION"-mac-arm64.zip)
          fi
          # shellcheck disable=SC2086
          gh release upload "$TAG_NAME" ${upload[@]} --clobber
