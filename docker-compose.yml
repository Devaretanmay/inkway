name: inkway

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: inkway
      POSTGRES_USER: ${POSTGRES_USER:-inkway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inkway}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
